<style>

</style></head><body><main>
<div class="card" id="join">
 <h1 id="jt" aria-label="Cha-Cha-Charades!"></h1>
 <div class="tag" id="tag" aria-live="off"></div>
 <div class="row"><input id="name" placeholder="Your name (or a fake one)" maxlength="14"><input id="code" placeholder="Room code, make one up" maxlength="16" value="friends"></div>
 <div class="row"><button class="go" id="jb">Let me in</button><button id="qb" hidden>🎲 Random player</button><button id="bb">🤖 Fight a bot</button></div>
 <p style="margin:0;max-width:34em">One person gets a secret word and has <b>5 stickers</b> and <b>3 words</b> to explain it. Everyone else guesses. Fewer pieces, more points. It’s harder than it sounds, and no, you won’t be good at it.</p>
</div>
<div id="game" hidden></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Runs only outside Claude: rooms + random matching on Firebase Realtime Database (SDK 13.1.0, modular).
   Each room has fixed seats ("a","b"); window.SLOTS can list more seats (and database.rules.json must allow them). */
if(typeof claude==='undefined'){window.HAS_QUICK=true;let fb=null;
 const SL=()=>(window.SLOTS||'ab').split(''),clean=c=>c.toLowerCase().replace(/[^a-z0-9_-]/g,'-').slice(0,40);
 const boot=async()=>{if(fb)return fb;
  const load=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('Could not load '+src));document.head.append(e)});
  if(!window.FIREBASE_CONFIG)await load('firebase-config.js');
  const V='https://www.gstatic.com/firebasejs/13.1.0/',M=window.__FB||{a:await import(V+'firebase-app.js'),u:await import(V+'firebase-auth.js'),d:await import(V+'firebase-database.js')};
  const app=M.a.initializeApp(window.FIREBASE_CONFIG),uid=(await M.u.signInAnonymously(M.u.getAuth(app))).user.uid;
  return fb={M:M.d,db:M.d.getDatabase(app),uid}};
 window.claude={use:async n=>n!=='room'?null:{
  quick:async()=>{const {M,db,uid}=await boot();
   const w=(await M.get(M.ref(db,'queue'))).val()||{};
   for(const [id,v] of Object.entries(w)){if(id===uid||!v||!v.room)continue;
    const n=Object.keys((await M.get(M.ref(db,'rooms/'+v.room+'/players'))).val()||{}).length;
    if(n>0&&n<SL().length)return v.room;
    if(n===0)M.remove(M.ref(db,'queue/'+id)).catch(()=>{})}
   const code='q-'+Array.from({length:6},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.random()*36|0]).join('');
   const qr=M.ref(db,'queue/'+uid);await M.set(qr,{room:code});M.onDisconnect(qr).remove();return code},
  join:async code=>{try{const {M,db,uid}=await boot(),c=clean(code),base=M.ref(db,'rooms/'+c+'/players');
   let ps={},fn=null,mine={j:1,u:uid},qd=false,me=null;
   await new Promise(ok=>{let first=true;M.onValue(base,s=>{ps=s.val()||{};if(first){first=false;ok()}else{
    if(!qd&&Object.keys(ps).length>=SL().length){qd=true;M.remove(M.ref(db,'queue/'+uid)).catch(()=>{})}if(fn)fn()}})});
   for(const sl of SL()){if(ps[sl]&&ps[sl].u!==uid)continue;const r=M.ref(db,'rooms/'+c+'/players/'+sl);
    try{await M.set(r,mine);me=r;break}catch(e){if(!/PERMISSION/i.test(String(e.code||e.message)))throw e}}
   if(!me)throw new Error('full');
   M.onDisconnect(me).remove();
   return{peers:()=>Object.values(ps).filter(x=>x&&x.u).map(pr=>({peer:pr.u,isMe:pr.u===uid,presence:pr})),
    presence:async p=>{mine={...mine,...p,u:uid};await M.set(me,JSON.parse(JSON.stringify(mine)))},onPeers:f=>{fn=f}}
  }catch(e){console.error('Room setup failed:',e);throw e}}}}}
</script>
<script>
const $=s=>document.getElementById(s);
const ST=['🔥','💧','🌍','☀️','🌙','⭐','❄️','🌳','🐶','🐱','🐟','🦁','🍕','🍎','🍞','☕','🏠','🚗','✈️','🚢','⚽','🎵','🎬','📚','💡','💰','❤️','💀','👑','🔑','⏰','👀','🧠','😂','😢','😡','🏃','😴','➕','➡️','⬆️','⬇️','❌'];
const MAXS=5,MAXW=3,ROUNDS=6,TRIES=4;
const TARGETS=['pizza','vampire','rainbow','birthday','earthquake','astronaut','library','sunburn','traffic jam','homework','pirate','snowman','jealousy','nightmare','wedding','coffee','guitar','volcano','Halloween','insomnia','detective','vacation','hospital','internet','gravity','time travel','dinosaur','zombie','camping','fireworks'];
let mode=null,room=null,sample=null,name='',round=0,score=0,S={},lastKey='',myId='';
const newS=()=>({target:null,clue:[],results:[],done:false,solved:false,sent:false,seen:{},scored:false,swapped:false,busy:''});
const pts=n=>Math.max(2,10-n);
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\b(the|a|an)\b/g,'').replace(/s\b/g,'').replace(/\s+/g,' ').trim();
const match=(a,b)=>{a=norm(a);b=norm(b);return !!a&&!!b&&a.replace(/ /g,'')===b.replace(/ /g,'')};
const pick=()=>TARGETS[Math.random()*TARGETS.length|0];
const el=(t,txt,c)=>{const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(c)e.className=c;return e};
const push=p=>mode==='room'&&room.presence({name,round,score,started:true,...p}).catch(()=>{});
const clueText=c=>c.slice().sort((a,b)=>(a.x||0)-(b.x||0)).map(i=>i.t==='s'?i.v:'"'+i.v+'"').join(' ')+' (listed left to right as arranged on a whiteboard)';
async function ask(p,fb){try{const r=await sample(p,{modelTier:'quick',cache:false});return(r.text||'').trim()||fb}catch(e){return fb}}

function myRole(){if(mode==='solo')return round%2===0?'give':'guess';
 const all=room.peers().slice().sort((a,b)=>a.peer<b.peer?-1:1),g=all[round%all.length];return g&&g.isMe?'give':'guess'}
function giverPres(){if(mode==='solo')return S;
 const all=room.peers().slice().sort((a,b)=>a.peer<b.peer?-1:1),g=all[round%all.length];
 return g&&g.presence.round===round?{...g.presence,name:g.presence.name}:null}

async function startRound(){S=newS();lastKey='';S.role=myRole();
 if(S.role==='give')S.target=pick();
 push({role:S.role,clue:null,results:[],done:false,solved:false,target:null,guess:null,gseq:0,sent:false});
 if(mode==='solo'&&S.role==='guess'){S.busy='The AI is picking a word you’ll never get…';render();await botClue()}
 render()}

const BANK=[['pizza','🍕','🔥','w:cheese'],['vampire','💀','🌙','w:bite'],['rainbow','☀️','💧','w:colors'],['birthday','🎂','🎁','w:candles'],['earthquake','🌍','⬇️','w:shake'],['astronaut','🚀','🌙','w:helmet'],['library','📚','😴','w:shh'],['sunburn','☀️','🔥','w:red'],['traffic jam','🚗','🚗','🚗','w:stuck'],['homework','📚','😢','w:tonight'],['pirate','🚢','💰','w:arrr'],['snowman','❄️','🥕','w:carrot'],['jealousy','👀','😡','w:green'],['nightmare','🌙','😱','w:scary'],['wedding','💍','❤️','w:cake'],['coffee','☕','😴','w:morning'],['guitar','🎸','🎵','w:strings'],['volcano','🌋','🔥','w:lava'],['insomnia','🌙','👀','w:awake'],['detective','🔍','🧠','w:crime'],['vacation','✈️','☀️','w:beach'],['hospital','🏥','😢','w:doctor'],['internet','🌍','💡','w:wifi'],['dinosaur','🦖','🌍','w:extinct'],['zombie','💀','🏃','w:brains'],['camping','🌳','🔥','w:tent'],['fireworks','🎆','💥','w:night'],['karaoke','🎤','🎵','w:terrible'],['gym','🏋️','😢','w:monday'],['haircut','✂️','😬','w:regret']];
const FUNNY=['a sad sandwich','banana','tax fraud','my ex','spaghetti','a haunted toaster','my landlord','soup','a very angry duck','Wi-Fi'];
let bank=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function botClue(){if(!bank.length)bank=BANK.slice().sort(()=>Math.random()-.5);
 const [target,...rest]=bank.pop();await wait(900);
 S.target=target;S.clue=rest.map(x=>x.startsWith('w:')?{t:'w',v:x.slice(2)}:{t:'s',v:x});S.sent=true;S.busy=''}
async function botGuess(){S.busy='The AI is staring at your sticker mess…';render();
 for(let i=0;i<TRIES&&!S.done;i++){await wait(1000);
  const ok=Math.random()<Math.min(.7,.12+.1*S.clue.length+.08*i);let g=S.target;
  if(!ok){do{g=Math.random()<.5?FUNNY[Math.random()*FUNNY.length|0]:pick()}while(match(g,S.target))}
  S.results.push({n:'AI',g,ok});if(ok||S.results.length>=TRIES){S.done=true;S.solved=ok;if(ok)score+=pts(S.clue.length)}
  S.busy=S.done?'':'The AI is staring at your sticker mess…';render()}}
function submitGuess(g){if(!g.trim())return;
 if(mode==='solo'){const ok=match(g,S.target);S.results.push({n:name,g,ok});
  if(ok||S.results.length>=TRIES){S.done=true;S.solved=ok;if(ok)score+=pts(S.clue.length)}render()}
 else{S.gseq=(S.gseq||0)+1;push({guess:g.trim(),gseq:S.gseq})}}
async function sendClue(){S.sent=true;
 if(mode==='solo'){render();await botGuess()}else{push({clue:S.clue,sent:true,results:[],done:false,solved:false});render()}}

function update(){if(mode!=='room'||!S.role)return;
 if(!S.sent&&!S.clue.length&&!S.results.length){const r=myRole();if(r!==S.role){S.role=r;if(r==='give'&&!S.target)S.target=pick();lastKey=''}}const ps=room.peers();myId=(ps.find(p=>p.isMe)||{}).peer;
 if(S.role==='give'&&S.sent&&!S.done){let ch=false;
  ps.filter(p=>!p.isMe&&p.presence.round===round&&p.presence.gseq>(S.seen[p.peer]||0)).forEach(p=>{S.seen[p.peer]=p.presence.gseq;
   S.results.push({p:p.peer,n:p.presence.name||'?',g:p.presence.guess||'',ok:match(p.presence.guess,S.target)});ch=true});
  if(ch){const ok=S.results.some(r=>r.ok);if(ok||S.results.length>=TRIES){S.done=true;S.solved=ok;if(ok&&!S.scored){S.scored=true;score+=pts(S.clue.length)}}
   push({clue:S.clue,sent:true,results:S.results,done:S.done,solved:S.solved,target:S.done?S.target:null})}}
 if(S.role==='guess'){const g=giverPres();
  if(g&&g.done&&g.solved&&!S.scored&&(g.results||[]).some(r=>r.ok&&r.p===myId)){S.scored=true;score+=pts((g.clue||[]).length);push({})}}
 render()}

function view(){if(mode==='solo')return S;if(S.role==='give')return S;
 const g=giverPres()||{};return{clue:g.clue||[],results:g.results||[],done:!!g.done,solved:!!g.solved,target:g.target,sent:!!g.sent,gname:g.name}}

const PAPER='paper.png';
const BW=900,BH=578,MARK=['#d6336c','#1c7ed6','#2f9e44','#e8590c','#7048e8'];
const FONT='bold 60px "Patrick Hand","Comic Sans MS","Marker Felt",system-ui,sans-serif';
const spawn=()=>({x:(Math.random()-.2)*420,y:(Math.random()-.5)*320});
let T=null;
function tex(it,k){const c=document.createElement('canvas'),x=c.getContext('2d');
 if(it.t==='s'){c.width=c.height=170;x.font='104px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#fff';x.shadowBlur=9;for(let i=0;i<4;i++)x.fillText(it.v,85,92)}
 else{x.font=FONT;const w=Math.ceil(x.measureText(it.v).width)+50;c.width=w;c.height=110;x.font=FONT;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=16;x.strokeStyle='#fff';x.strokeText(it.v,w/2,58);x.fillStyle=MARK[k%5];x.fillText(it.v,w/2,58)}
 return{t:new THREE.CanvasTexture(c),w:c.width,h:c.height}}
function removeSel(){const i=S.clue.indexOf(S.sel);if(i>=0){S.clue.splice(i,1);S.sel=null;render()}}
function stage(){if(T)return T;
 const cv=document.createElement('canvas');cv.className='board';
 const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(1);R.setSize(1260,810,false);
 const sc=new THREE.Scene(),cam=new THREE.OrthographicCamera(-BW/2,BW/2,BH/2,-BH/2,.1,10);cam.position.z=5;
 // cartoon paper: posterised shading, tinted grid lines, and a stop-motion "boil" wobble
 const mat=new THREE.ShaderMaterial({uniforms:{map:{value:new THREE.TextureLoader().load(PAPER,()=>T.draw())},t:{value:0}},
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D map;uniform float t;varying vec2 v;void main(){vec2 u=v+.0025*vec2(sin(v.y*40.+t*7.),cos(v.x*40.+t*5.));vec3 c=texture2D(map,u).rgb;float l=dot(c,vec3(.3,.59,.11));float q=floor(l*4.+.5)/4.;vec3 b=mix(vec3(.86,.83,.78),vec3(1.,.98,.95),q);float ln=smoothstep(.66,.5,l);vec3 toon=mix(b,vec3(.36,.28,.55),ln*.6);gl_FragColor=vec4(mix(c,toon,.4),1.);}'});
 sc.add(new THREE.Mesh(new THREE.PlaneGeometry(BW,BH),mat));
 const grp=new THREE.Group();grp.position.z=1;sc.add(grp);
 T={cv,grp,mat,sp:[],edit:false,draw(){this.sp.forEach(m=>{const f=this.edit&&S.sel===m.userData.it?1.18:1,b=m.userData.base;m.scale.set(b[0]*f,b[1]*f,1)});R.render(sc,cam)}};
 let drag=null;const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*BW-BW/2,y:BH/2-(e.clientY-r.top)/r.height*BH}};
 cv.onpointerdown=e=>{if(!T.edit)return;const p=pos(e);let hit=null;
  for(const m of T.sp.slice().reverse()){if(Math.abs(p.x-m.position.x)<m.scale.x/2&&Math.abs(p.y-m.position.y)<m.scale.y/2){hit=m;break}}
